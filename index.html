<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUST Bus Tracker | Live</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --primary: #2ecc71; --dark: #121212; --accent: #ff9800; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--dark); color: white; text-align: center; overflow-x: hidden; }

        /* Top Navigation Bar */
        .top-nav { background: #1f1f1f; padding: 15px; display: flex; justify-content: space-around; position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid var(--primary); }
        .nav-btn { background: transparent; border: 1px solid var(--primary); color: white; padding: 8px 18px; border-radius: 50px; cursor: pointer; transition: 0.3s; font-weight: bold; font-size: 14px; }
        .nav-btn:hover { background: var(--primary); color: black; box-shadow: 0 0 15px var(--primary); }

        /* Notice Bar */
        .notice-bar { background: var(--accent); color: black; padding: 10px; font-weight: bold; cursor: pointer; overflow: hidden; white-space: nowrap; font-size: 14px; }
        .notice-content { display: inline-block; animation: marquee 18s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* Main Map Display */
        .map-container { position: relative; width: 100%; height: 60vh; border-bottom: 2px solid #333; }
        #main-map { height: 100%; width: 100%; }
        .map-overlay-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.85); padding: 25px; border-radius: 12px; z-index: 500; border: 2px solid #e74c3c; width: 80%; max-width: 300px; backdrop-filter: blur(5px); }

        /* Schedule Section (No Slideshow) */
        #schedule-section { padding: 40px 10px; background: #1a1a1a; }
        .schedule-img-container { position: relative; max-width: 600px; margin: 20px auto; border-radius: 15px; overflow: hidden; border: 3px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .schedule-img { width: 100%; height: auto; display: block; }
        .dl-btn { display: inline-block; margin-top: 20px; background: var(--primary); color: black; padding: 12px 25px; border-radius: 50px; text-decoration: none; font-size: 15px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.3s; }
        .dl-btn:hover { transform: scale(1.05); background: #27ae60; }

        /* Admin Modal */
        #admin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; }
        .admin-box { background: #222; width: 90%; max-width: 380px; padding: 30px; border-radius: 20px; border: 1px solid var(--primary); }
        .admin-box input { padding: 12px; width: 100%; margin-bottom: 20px; border-radius: 8px; border: none; background: #333; color: white; text-align: center; font-size: 16px; }

        footer { padding: 30px; font-size: 14px; color: #777; background: #000; margin-top: 20px; border-top: 1px solid #222; }
        h2 { margin-bottom: 10px; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="top-nav">
        <button class="nav-btn" onclick="showSchedule()">Bus Schedule</button>
        <button class="nav-btn" onclick="openAdmin()">Admin Panel</button>
    </div>

    <div class="notice-bar" onclick="alert('Notice: Please wait at the designated pick-up points. Ensure your GPS is enabled for the best tracking experience.')">
        <div class="notice-content">⚠️ ATTENTION: Classes and Bus Routes are running as per the regular schedule. Contact the transport office for emergencies. ⚠️</div>
    </div>

    <div class="map-container">
        <div id="main-map"></div>
        <div id="no-entry-msg" class="map-overlay-msg" style="display: none;">
            <h3 style="color: #ff4444; margin-bottom: 10px;">NO ENTRY</h3>
            <p style="font-size: 14px;">No buses are currently sharing live location.</p>
        </div>
    </div>

    <div id="schedule-section">
        <h2>Karnaphuli Regular Schedule</h2>
        <div class="schedule-img-container">
            <img id="bus-schedule-pic" class="schedule-img" src="schedule.JPEG" alt="Karnaphuli Bus Schedule">
        </div>
        <a href="schedule.jpeg" class="dl-btn" download="Karnaphuli_Schedule.JPEG">⬇️ Download Schedule</a>
    </div>

    <div id="admin-modal" onclick="if(event.target == this) closeAdmin()">
        <div class="admin-box">
            <h3 style="color: var(--primary); margin-bottom: 20px;">DRIVER LOGIN</h3>
            <input type="password" id="adminPass" placeholder="Enter Admin Password">
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <button class="nav-btn" style="background: var(--primary); color: black;" onclick="startAdminTracking('Kornofuli_1')">Start Kornofuli-1</button>
                <button class="nav-btn" style="background: var(--primary); color: black;" onclick="startAdminTracking('Kornofuli_2')">Start Kornofuli-2</button>
                <button class="nav-btn" style="background: var(--primary); color: black;" onclick="startAdminTracking('Rupsha')">Start Rupsha</button>
                <button class="nav-btn" style="border-color: #e74c3c; color: #e74c3c;" onclick="closeAdmin()">Close</button>
            </div>
        </div>
    </div>

    <footer>
        Developed by: **Ratul Krishna Mojumder-EEE**
    </footer>
