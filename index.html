<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কর্ণফুলী বাস ট্র্যাকার | AUST</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --primary: #2ecc71; --dark: #0f0f0f; --accent: #ff9800; --red: #e74c3c; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Hind Siliguri', sans-serif; }
        
        body { background: var(--dark); color: white; min-height: 100vh; width: 100vw; overflow-x: hidden; }

        /* Navigation */
        .top-nav { width: 100%; position: fixed; top: 0; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .notice-bar { background: var(--accent); color: black; padding: 12px; font-weight: bold; cursor: pointer; position: relative; height: 45px; overflow: hidden; display: flex; align-items: center; }
        #scrolling-notice { position: absolute; white-space: nowrap; will-change: transform; font-size: 14px; }
        .nav-links { background: rgba(15,15,15,0.9); backdrop-filter: blur(15px); padding: 12px; display: flex; justify-content: center; gap: 10px; border-bottom: 1px solid #333; }
        .nav-item { color: white; text-decoration: none; font-size: 11px; border: 1.5px solid var(--primary); padding: 5px 12px; border-radius: 50px; cursor: pointer; font-weight: bold; transition: 0.3s; }

        /* Hero UI */
        .hero { min-height: 100vh; width: 100%; background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1570125909232-eb263c188f7e?q=80&w=2071'); background-size: cover; background-position: center; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 100px; padding-bottom: 50px; }
        .bus-container { width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .bus-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: #555; margin-right: 5px; }
        .active-dot { background: var(--primary); box-shadow: 0 0 8px var(--primary); }

        /* Page Transitions */
        .page-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: var(--dark); overflow-y: auto; }
        .view-header { position: sticky; top: 0; background: #1a1a1a; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        
        /* Map & Dashboard */
        #map { height: calc(100vh - 160px); width: 100%; }
        .dash-card { background: #1a1a1a; margin: 15px; padding: 20px; border-radius: 15px; border-left: 5px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .btn-sm { padding: 10px 18px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-stop { background: var(--red); color: white; }
        .btn-start { background: var(--primary); color: black; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        footer { margin-top: 30px; font-size: 12px; color: #777; text-align: center; }
        .ratul-tag { color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="notice-bar" onclick="openPage('notice-page')">
            <div id="scrolling-notice"></div>
        </div>
        <div class="nav-links">
            <div class="nav-item" onclick="openPage('schedule-page')">Schedule</div>
            <div class="nav-item" onclick="handleAdminEntry()">Admin Panel</div>
            <div class="nav-item" style="border-color: var(--red); color: var(--red);" onclick="handleDevEntry()">Developer</div>
        </div>
    </div>

    <div class="hero">
        <h1 style="color: var(--primary); font-size: 3rem; letter-spacing: 2px; margin-bottom: 10px;">কর্ণফুলী</h1>
        <div class="bus-container" id="main-bus-list"></div>
        <p id="sharing-status-info" style="margin-top:20px; font-size:14px; color:var(--primary); display:none; animation: pulse 1.5s infinite; font-weight: bold;">🛰️ REAL-TIME GPS ACTIVE</p>
        <footer>Developed by: <span class="ratul-tag">Ratul Krishna Mojumder-EEE53</span></footer>
    </div>

    <div id="admin-dash" class="page-view">
        <div class="view-header">
            <h2>Admin Control</h2>
            <div style="display: flex; gap: 5px;">
                <button class="nav-item" style="border-color: var(--red);" onclick="logout()">Logout</button>
                <button class="nav-item" onclick="closePage()">Back</button>
            </div>
        </div>
        <div id="admin-controls"></div>
    </div>

    <div id="dev-dash" class="page-view">
        <div class="view-header"><h2>Master Control</h2><div><button class="nav-item" onclick="logout()">Logout</button><button class="nav-item" onclick="closePage()">Back</button></div></div>
        <div id="dev-controls"></div>
    </div>

    <div id="map-page" class="page-view">
        <div class="view-header"><h2 id="map-title">Live</h2><button class="nav-item" onclick="closePage()">Exit</button></div>
        <div id="map"></div>
    </div>

    <div id="notice-page" class="page-view">
        <div class="view-header"><h2>Notice Board</h2><button class="nav-item" onclick="closePage()">Back</button></div>
        <div id="full-notice-text" style="padding: 25px; line-height: 1.8; white-space: pre-line; background: #1a1a1a; margin: 15px; border-radius: 15px;"></div>
    </div>
    
    <div id="schedule-page" class="page-view">
        <div class="view-header"><h2>Bus Schedule</h2><button class="nav-item" onclick="closePage()">Back</button></div>
        <div style="padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center;">
            <h3 style="color: var(--primary); margin-bottom: 15px;">Regular Time schedule</h3>
            <img src="schedule.jpeg" style="width: 90%; max-width: 500px; border-radius: 12px; border: 2px solid #333;">
            <a href="schedule.jpeg" download="AUST_Bus_Schedule.jpeg" style="display: block; width: 80%; max-width: 500px; margin-top: 20px; background: var(--primary); color: black; padding: 15px; text-decoration: none; border-radius: 10px; font-weight: bold; text-align: center;">📥 DOWNLOAD SCHEDULE</a>
        </div>
    </div>

    <script>
        // --- 1. CONFIG ---
        const ADMIN_PASS = "003", DEV_PASS = "092418", VARSITY_LOC = { lat: 23.764021, lng: 90.406310 };
        const firebaseConfig = {
            apiKey: "AIzaSyCUmIMnruHmwmJkbzWpK21_SVE_qCzUTZc",
            authDomain: "bus-tracker-514e6.firebaseapp.com",
            projectId: "bus-tracker-514e6",
            storageBucket: "bus-tracker-514e6.firebasestorage.app",
            messagingSenderId: "790540182055",
            appId: "1:790540182055:web:88dae86aa602a3c215a402",
            measurementId: "G-W7HLJZVLX5",
            databaseURL: "https://bus-tracker-514e6-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let map, marker, watchID, forceInterval, activeBusID = null, wakeLock = null;
        const busIDs = ['Kornofuli_1', 'Kornofuli_2', 'Rupsha'];
        const busNames = { 'Kornofuli_1': 'কর্ণফুলী-১', 'Kornofuli_2': 'কর্ণফুলী-২', 'Rupsha': 'রূপসা' };
        
        const sessionID = (() => {
            let id = localStorage.getItem('bus_session_id');
            if(!id) { id = 'SID_' + Math.random().toString(36).substr(2, 9); localStorage.setItem('bus_session_id', id); }
            return id;
        })();

        // --- 2. AUTH LOGIC (No Auto-Logout) ---
        function handleAdminEntry() {
            if(localStorage.getItem('auth') === 'admin') {
                openPage('admin-dash');
            } else {
                let p = prompt("Enter Admin Password:");
                if(p === ADMIN_PASS) {
                    localStorage.setItem('auth', 'admin');
                    openPage('admin-dash');
                }
            }
        }

        function handleDevEntry() {
            if(localStorage.getItem('auth') === 'dev') {
                openPage('dev-dash');
            } else {
                let p = prompt("Enter Dev Password:");
                if(p === DEV_PASS) {
                    localStorage.setItem('auth', 'dev');
                    openPage('dev-dash');
                }
            }
        }

        function logout() {
            localStorage.removeItem('auth');
            location.reload();
        }

        // --- 3. TRACKING LOGIC (Real-time & Forced) ---
        async function toggleShare(id, start) {
            if(!start) {
                if(watchID) navigator.geolocation.clearWatch(watchID);
                if(forceInterval) clearInterval(forceInterval);
                if(wakeLock) { wakeLock.release(); wakeLock = null; }
                db.ref('buses/' + id).update({ status: 'idle', driverID: null });
                document.getElementById('sharing-status-info').style.display = 'none';
                return;
            }

            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}

            db.ref('buses/' + id).update({ status: 'tracking', driverID: sessionID });
            document.getElementById('sharing-status-info').style.display = 'block';

            const updatePos = () => {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    db.ref('buses/' + id).update({ lat, lng, lastUpdate: firebase.database.ServerValue.TIMESTAMP });

                    if(getDist(lat, lng, VARSITY_LOC.lat, VARSITY_LOC.lng) < 0.2) {
                        toggleShare(id, false);
                        alert("AUST-er kachakachi pouchecho! Tracking off.");
                    }
                }, null, { enableHighAccuracy: true });
            };

            updatePos();
            watchID = navigator.geolocation.watchPosition(updatePos, null, { enableHighAccuracy: true });
            forceInterval = setInterval(updatePos, 5000); // Force update every 5 sec
        }

        // --- 4. UI SYNC ---
        db.ref('buses').on('value', (snap) => {
            const data = snap.val() || {};
            let busHtml = '', adminHtml = '', devHtml = '';
            busIDs.forEach(id => {
                const bus = data[id] || { status: 'idle' };
                const isLive = bus.status === 'tracking';
                const isMine = bus.driverID === sessionID;
                const bName = busNames[id];

                busHtml += `<div class="bus-card" onclick="viewBus('${id}')"><div><h3>${bName}</h3><p style="font-size:11px; color:${isLive?'#2ecc71':'#888'};"><span class="status-dot ${isLive?'active-dot':''}"></span> ${isLive?'চলমান':'বন্ধ'}</p></div><div style="color:var(--primary);">➔</div></div>`;
                
                adminHtml += `<div class="dash-card"><div><h3>${bName}</h3><p style="font-size:12px;">${isLive ? (isMine ? '🔴 Sharing active' : '⚠️ Locked') : '🟢 Ready'}</p></div>`;
                if(isLive && isMine) adminHtml += `<button class="btn-sm btn-stop" onclick="toggleShare('${id}', false)">STOP</button>`;
                else if(!isLive) adminHtml += `<button class="btn-sm btn-start" onclick="toggleShare('${id}', true)">START</button>`;
                adminHtml += `</div>`;
                
                devHtml += `<div class="dash-card"><div><h3>${bName}</h3><p>${isLive?'Live':'Idle'}</p></div><button class="btn-sm btn-stop" onclick="db.ref('buses/${id}').update({status:'idle', driverID:null})">RESET</button></div>`;
            });
            document.getElementById('main-bus-list').innerHTML = busHtml;
            document.getElementById('admin-controls').innerHTML = adminHtml;
            document.getElementById('dev-controls').innerHTML = devHtml;
        });

        function viewBus(id) {
            db.ref('buses/'+id).once('value', s => {
                const d = s.val();
                if(d && d.status === 'tracking') {
                    activeBusID = id; openPage('map-page');
                    document.getElementById('map-title').innerText = busNames[id];
                    if(map) map.remove();
                    map = L.map('map').setView([d.lat, d.lng], 16);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                    marker = L.marker([d.lat, d.lng]).addTo(map);
                    db.ref('buses/'+id).on('value', l => { if(marker && l.val()) marker.setLatLng([l.val().lat, l.val().lng]); });
                } else alert("Bus is offline.");
            });
        }

        // --- 5. UTILS ---
        function getDist(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2-lat1) * Math.PI/180, dLon = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function openPage(id) { document.querySelectorAll('.page-view').forEach(p => p.style.display = 'none'); document.getElementById(id).style.display = 'block'; }
        function closePage() { document.querySelectorAll('.page-view').forEach(p => p.style.display = 'none'); }

        // Notice
        const myNotice = `সেমিস্টার ফাইনাল পরীক্ষায় (কর্ণফুলী-১ ও কর্ণফুলী-২) বাস চলাচল করবে।\n📍 চাষাড়া থেকে: ১ম বাস - ৬:৩০ AM | ২য় বাস - ৬:৪৫ AM`;
        document.getElementById('scrolling-notice').innerText = "📢 " + myNotice.replace(/\n/g, " | ") + " 📢";
        document.getElementById('full-notice-text').innerText = myNotice;

        function startNoticeAnimation() {
            const containerWidth = document.querySelector('.notice-bar').offsetWidth;
            const scrollElement = document.getElementById('scrolling-notice');
            let currentPos = containerWidth;
            function animate() {
                currentPos -= 1.2;
                if (currentPos < -scrollElement.offsetWidth) currentPos = containerWidth;
                scrollElement.style.transform = `translateX(${currentPos}px)`;
                requestAnimationFrame(animate);
            }
            animate();
        }
        window.onload = startNoticeAnimation;
    </script>
</body>
</html>
