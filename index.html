<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kornofuli Bus Tracker | AUST</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --primary: #2ecc71; --dark: #0f0f0f; --accent: #ff9800; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--dark); color: white; overflow: hidden; height: 100vh; width: 100vw; }

        .hero {
            height: 100vh; width: 100%;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1570125909232-eb263c188f7e?q=80&w=2071&auto=format&fit=crop');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .top-nav { width: 100%; position: fixed; top: 0; z-index: 1000; }
        .notice-bar { background: var(--accent); color: black; padding: 12px; font-weight: bold; cursor: pointer; overflow: hidden; white-space: nowrap; font-size: 14px; border-bottom: 2px solid rgba(0,0,0,0.1); }
        
        /* 30 Seconds Speed */
        .notice-content { display: inline-block; animation: marquee 30s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .nav-links { background: rgba(0,0,0,0.6); backdrop-filter: blur(15px); padding: 12px; display: flex; justify-content: center; gap: 15px; }
        .nav-item { color: white; text-decoration: none; font-size: 13px; border: 1.5px solid var(--primary); padding: 6px 16px; border-radius: 50px; cursor: pointer; font-weight: bold; }

        h1 { font-size: 2.5rem; color: var(--primary); margin-bottom: 5px; letter-spacing: 2px; }
        .bus-container { width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .bus-card {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 18px; border-radius: 15px; cursor: pointer; backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
        }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: #555; margin-right: 5px; }
        .active-dot { background: var(--primary); box-shadow: 0 0 8px var(--primary); }

        .page-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: var(--dark); overflow-y: auto; }
        .view-header { position: sticky; top: 0; background: #1a1a1a; padding: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 2001; }
        #map { height: calc(100vh - 130px); width: 100%; }
        
        .refresh-btn { 
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 300px; background: var(--primary); color: black;
            padding: 15px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer;
            z-index: 10000;
        }

        .content-box { max-width: 500px; margin: 20px auto; padding: 20px; text-align: center; }
        
        /* Improved Notice Card Design */
        .notice-card { background: #1e1e1e; border-radius: 20px; padding: 30px; border-top: 5px solid var(--accent); text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .notice-card h2 { color: var(--accent); margin-bottom: 20px; font-size: 1.5rem; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .notice-text-main { white-space: pre-line; color: #fff; line-height: 1.8; font-size: 16px; }

        .schedule-img { width: 100%; border-radius: 10px; border: 1px solid #333; }
        .btn-action { display: inline-block; margin-top: 20px; background: var(--primary); color: black; padding: 12px 30px; border-radius: 50px; text-decoration: none; font-weight: bold; border: none; cursor: pointer; }

        footer { position: absolute; bottom: 15px; font-size: 11px; color: #666; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="notice-bar" onclick="openPage('notice-page')">
            <div id="scrolling-notice" class="notice-content"></div>
        </div>
        <div class="nav-links">
            <div class="nav-item" onclick="openPage('schedule-page')">Schedule</div>
            <div class="nav-item" onclick="openPage('admin-page')">Admin</div>
        </div>
    </div>

    <div class="hero">
        <h1>KORNOFULI</h1>
        <div class="bus-container">
            <div class="bus-card" onclick="checkBus('Kornofuli_1')">
                <div><h3>Kornofuli - 1</h3><p id="text-Kornofuli_1" style="font-size:11px; color:#888;"><span class="status-dot" id="dot-Kornofuli_1"></span> Offline</p></div>
                <div style="color:var(--primary);">➔</div>
            </div>
            <div class="bus-card" onclick="checkBus('Kornofuli_2')">
                <div><h3>Kornofuli - 2</h3><p id="text-Kornofuli_2" style="font-size:11px; color:#888;"><span class="status-dot" id="dot-Kornofuli_2"></span> Offline</p></div>
                <div style="color:var(--primary);">➔</div>
            </div>
            <div class="bus-card" onclick="checkBus('Rupsha')">
                <div><h3>Rupsha</h3><p id="text-Rupsha" style="font-size:11px; color:#888;"><span class="status-dot" id="dot-Rupsha"></span> Offline</p></div>
                <div style="color:var(--primary);">➔</div>
            </div>
        </div>
        <footer>Developed by: **Ratul Krishna Mojumder-EEE**</footer>
    </div>

    <div id="notice-page" class="page-view">
        <div class="view-header"><h2>Notice Board</h2><button class="nav-item" style="background:#e74c3c; border:none;" onclick="closePage()">BACK</button></div>
        <div class="content-box">
            <div class="notice-card">
                <h2>📢 Exam Notice</h2>
                <div id="full-notice-text" class="notice-text-main"></div>
            </div>
        </div>
    </div>

    <div id="schedule-page" class="page-view">
        <div class="view-header"><h2>Bus Schedule</h2><button class="nav-item" style="background:#e74c3c; border:none;" onclick="closePage()">BACK</button></div>
        <div class="content-box"><img src="schedule.jpeg" class="schedule-img"><br><a href="schedule.jpeg" download class="btn-action">DOWNLOAD SCHEDULE</a></div>
    </div>

    <div id="map-page" class="page-view">
        <div class="view-header"><h2 id="map-title">Live</h2><button class="nav-item" style="background:#e74c3c; border:none;" onclick="closePage()">EXIT</button></div>
        <div id="map"></div>
        <button class="refresh-btn" onclick="refreshMap()">🔄 REFRESH MAP</button>
    </div>

    <div id="admin-page" class="page-view">
        <div class="view-header"><h2>Driver Panel</h2><button class="nav-item" style="background:#e74c3c; border:none;" onclick="closePage()">BACK</button></div>
        <div class="content-box">
            <input type="password" id="adminPass" placeholder="Enter Password" style="width:100%; padding:15px; margin-bottom:15px; background:#2a2a2a; color:white; border:none; border-radius:8px;">
            <select id="busSelect" style="width:100%; padding:15px; background:#2a2a2a; color:white; border:none; border-radius:8px;">
                <option value="Kornofuli_1">Kornofuli - 1</option>
                <option value="Kornofuli_2">Kornofuli - 2</option>
                <option value="Rupsha">Rupsha</option>
            </select>
            <button class="btn-action" style="width:100%;" onclick="startTracking()">START SHARING</button>
        </div>
    </div>

    <script>
        // ********************************************************
        // 1. SET YOUR NOTICE HERE (Eikhane change korle dui jaygay update hobe)
        // ********************************************************
        const myNotice = `সেমিস্টার ফাইনাল পরীক্ষায় (Karnaphuli 1 ও Karnaphuli 2) বাস চলাচল করবে।

📍 From Casara to AUST:
1st bus - 6:30 AM
2nd bus - 6:45 AM

⏳ For 9:30 AM - 12:30 PM Exam Days:
From AUST: 1st bus - 1:00 PM | 2nd bus - 1:30 PM

⏳ For 9:30 AM - 12:00 PM Exam Days:
From AUST: 1st bus - 12:30 PM | 2nd bus - 1:00 PM`;

        // Notice Update Function
        document.getElementById('scrolling-notice').innerText = "📢 " + myNotice.replace(/\n/g, " | ") + " 📢";
        document.getElementById('full-notice-text').innerText = myNotice;

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCUmIMnruHmwmJkbzWpK21_SVE_qCzUTZc",
            authDomain: "bus-tracker-514e6.firebaseapp.com",
            projectId: "bus-tracker-514e6",
            storageBucket: "bus-tracker-514e6.firebasestorage.app",
            messagingSenderId: "790540182055",
            appId: "1:790540182055:web:88dae86aa602a3c215a402",
            measurementId: "G-W7HLJZVLX5",
            databaseURL: "https://bus-tracker-514e6-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const ADMIN_PASS = "003";
        const VARSITY_LOC = { lat: 23.764021, lng: 90.406310 };
        let map, marker, watchID, currentActivePage = null, activeBusID = null;

        function openPage(id) {
            document.querySelectorAll('.page-view').forEach(p => p.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            currentActivePage = id;
            history.pushState({page: id}, null, "");
        }

        function closePage() {
            document.querySelectorAll('.page-view').forEach(p => p.style.display = 'none');
            currentActivePage = null;
        }

        window.onpopstate = function() { if (currentActivePage) closePage(); };

        const busIDs = ['Kornofuli_1', 'Kornofuli_2', 'Rupsha'];
        busIDs.forEach(id => {
            db.ref('buses/' + id + '/status').on('value', (snap) => {
                const status = snap.val();
                const dot = document.getElementById('dot-' + id);
                const text = document.getElementById('text-' + id);
                if(status === 'tracking') {
                    dot.classList.add('active-dot');
                    text.innerHTML = '<span class="status-dot active-dot"></span> Live Now';
                    text.style.color = '#2ecc71';
                } else {
                    dot.classList.remove('active-dot');
                    text.innerHTML = '<span class="status-dot"></span> Offline';
                    text.style.color = '#888';
                }
            });
        });

        function checkBus(id) {
            db.ref('buses/' + id).once('value', (snap) => {
                const data = snap.val();
                if(data && data.status === 'tracking') {
                    activeBusID = id;
                    openPage('map-page');
                    document.getElementById('map-title').innerText = id.replace('_', ' ');
                    initMap(data.lat, data.lng);
                    db.ref('buses/' + id).on('value', (live) => {
                        const d = live.val();
                        if(marker && d) marker.setLatLng([d.lat, d.lng]);
                    });
                } else { alert("Bus is offline."); }
            });
        }

        function initMap(lat, lng) {
            if (map) map.remove();
            map = L.map('map').setView([lat, lng], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            marker = L.marker([lat, lng]).addTo(map);
        }

        function refreshMap() {
            if(activeBusID) {
                db.ref('buses/' + activeBusID).once('value', (snap) => {
                    const d = snap.val();
                    if(d && marker) {
                        marker.setLatLng([d.lat, d.lng]);
                        map.setView([d.lat, d.lng]);
                    }
                });
            }
        }

        function startTracking() {
            const pass = document.getElementById('adminPass').value;
            const bus = document.getElementById('busSelect').value;
            if(pass !== ADMIN_PASS) { alert("Wrong Password!"); return; }

            db.ref('buses/' + bus + '/status').once('value', (snap) => {
                if(snap.val() === 'tracking') alert("Already live from another device!");
                else executeTracking(bus);
            });
        }

        function executeTracking(busID) {
            activeBusID = busID;
            openPage('map-page');
            db.ref('buses/' + busID).update({ status: 'tracking' });

            watchID = navigator.geolocation.watchPosition((pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                if(!map) initMap(lat, lng);
                marker.setLatLng([lat, lng]);
                db.ref('buses/' + busID).update({ lat, lng });

                if (getDist(lat, lng, VARSITY_LOC.lat, VARSITY_LOC.lng) < 0.1) {
                    alert("Reached AUST! Sharing Stopped.");
                    db.ref('buses/' + busID).update({ status: 'idle' });
                    location.reload();
                }
            }, null, { enableHighAccuracy: true });
        }

        function getDist(lat1, lon1, lat2, lon2) {
            let R = 6371;
            let dLat = (lat2-lat1)*Math.PI/180;
            let dLon = (lon2-lon1)*Math.PI/180;
            let a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
    </script>
</body>
</html>
